[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ihaerostudio-be"
version = "0.3.0"
description = "이해로 스튜디오 - 근거 기반 쉬운 판결 설명자료 제작 API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1", "pypdf>=5,<7", "reportlab>=4.3,<5", "pillow>=11,<13",
  "turso-serverless>=0.1,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
