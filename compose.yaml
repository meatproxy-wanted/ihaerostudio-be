services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      AUTH_MODE: ${AUTH_MODE:-anonymous}
      API_KEYS: ${API_KEYS:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-16384}
      COMFY_CLOUD_API_KEY: ${COMFY_CLOUD_API_KEY:-}
      COMFY_ASSET_ALLOWED_HOSTS: ${COMFY_ASSET_ALLOWED_HOSTS:-cloud.comfy.org}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - studio-data:/service/data
    restart: unless-stopped
volumes:
  studio-data:
